[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "mimosa-illume"
version = "0.1.0"
description = "Post-hoc explanations for tabular data using interpretable meta-encoding"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Simone Piaggesi", email = "piaggesi.simone@gmail.com" }]
dependencies = [
    "numpy>=1.23.4",
    "pandas>=1.5.1",
    "scipy>=1.10.1",
    "scikit-learn>=1.3.2",
    "tqdm>=4.64.1",
    "more-itertools>=10.5.0",
    "matplotlib>=3.5.3",
]

[project.optional-dependencies]
model = ["torch>=1.12.1", "torchvision>=0.13.1"]
notebook = [
    "torch>=1.12.1",
    "torchvision>=0.13.1",
    "lightgbm>=4.5.0",
    "xgboost>=1.5.1",
    "catboost>=1.2.7",
    "ipykernel>=6.29.5",
]
paper = [
    "torch>=1.12.1",
    "torchvision>=0.13.1",
    "lightgbm>=4.5.0",
    "xgboost>=1.5.1",
    "catboost>=1.2.7",
    "joblib>=1.4.2",
    "imbalanced-learn>=0.11.0",
    "deap>=1.4.1",
    "shap>=0.44.1",
    "lime>=0.2.0.1",
    "sympy>=1.13.1",
    "category-encoders>=2.6.3",
    "bitarray>=2.9.2",
    "ipython>=8.12.3",
]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/simonepiaggesi/illume"
Paper = "https://doi.org/10.1109/ICDM65498.2025.00074"

[tool.hatch.build.targets.wheel]
packages = ["src/illume"]

[tool.pytest.ini_options]
testpaths = ["tests"]
